_version = 1

[workflow]
graph = "workflow.fabro"

[run]
goal = "Improve the Fabro software factory inside modernagencysales/fabro-maestro using docs/factory/maestro-fabro-perfect-software-factory.md. Do not work on Maestro V2."
working_dir = "/Users/ajmal/Maestro/fabro-maestro"

[run.model]
provider = "openai"
name = "gpt-5.3-codex"

[run.model.controls]
reasoning_effort = "high"

[run.sandbox]
provider = "daytona"
preserve = true

[run.sandbox.daytona]
auto_stop_interval = 60

[run.integrations.github.permissions]
contents = "write"
pull_requests = "write"
issues = "read"

[run.pull_request]
enabled = true
draft = true
auto_merge = false
merge_strategy = "squash"

[[run.prepare.steps]]
script = ".fabro/scripts/bootstrap-factory-sandbox.sh"
